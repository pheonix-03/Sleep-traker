<!DOCTYPE html>
<html>
<head>
<title>Sleep Tracker 😴</title>
<style>
  body {
    font-family: "Roboto", sans-serif;
    background: #f7f3ff;
    margin: 0;
    padding: 20px;
  }
  h2 {
    text-align: center;
    color: #5a3e85;
    margin-bottom: 20px;
  }
  .segment {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  label {
    display: block;
    margin-top: 8px;
    color: #4a385f;
    font-size: 14px;
  }
  input {
    padding: 8px;
    width: 100%;
    border-radius: 8px;
    border: 1px solid #d3c7ea;
    margin-top: 3px;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    background: #7d5cc6;
    border: none;
    color: white;
    font-size: 16px;
    margin-top: 15px;
    cursor: pointer;
  }
  button:hover {
    background: #6b4ab0;
  }
  #addBtn {
    background: #e3d7fb;
    color: #5a3e85;
    border: 1px solid #bca9e8;
  }
  #addBtn:hover {
    background: #d4c5f8;
  }
  #result {
    text-align: center;
    margin-top: 20px;
    font-size: 1.4em;
    color: #3b2b4d;
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>Sleep Tracker 😴</h2>

<div id="segments"></div>

<button id="addBtn" onclick="addSegment()">+ Add Sleep Session</button>
<button onclick="calculateTotal()">Calculate Total Sleep</button>

<div id="result"></div>

<script>
function addSegment(){
  const container = document.getElementById("segments");
  const segment = document.createElement("div");
  segment.className = "segment";
  segment.innerHTML = `
    <label>Sleep Time:</label>
    <input type="time" class="sleep">
    <label>Wake Time:</label>
    <input type="time" class="wake">
  `;
  container.appendChild(segment);
}

// initial one
addSegment();

function diff(sleep, wake){
  if(!sleep || !wake) return 0;
  let s = new Date("1970-01-01T" + sleep + ":00");
  let w = new Date("1970-01-01T" + wake + ":00");
  if(w < s) w.setDate(w.getDate() + 1);
  return (w - s);
}

function calculateTotal(){
  let sleepInputs = document.querySelectorAll(".sleep");
  let wakeInputs = document.querySelectorAll(".wake");

  let totalMs = 0;
  for(let i=0; i<sleepInputs.length; i++){
    totalMs += diff(sleepInputs[i].value, wakeInputs[i].value);
  }
  if(totalMs === 0){
    result.innerHTML = "Please enter at least one sleep session.";
    return;
  }
  let hours = Math.floor(totalMs / (1000*60*60));
  let minutes = Math.floor((totalMs / (1000*60)) % 60);
  result.innerHTML = `Total Sleep: ${hours} hr ${minutes} min`;
}
</script>

</body>
</html>
